name: TabangNow Flutter checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabangnow-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Dart analyzer, tests and Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter toolchain
        run: flutter --version
      - name: Restore Dart packages
        run: flutter pub get
      - name: Analyze app and tests
        run: flutter analyze --no-fatal-infos lib test
      - name: Run Flutter tests
        run: flutter test --no-pub
      - name: Build debug Android APK (does not publish)
        run: flutter build apk --debug --no-pub --dart-define=API_BASE_URL=https://scsis-production-ac26.up.railway.app
